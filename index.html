<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARUN AD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: #050204;
    background-image:
        radial-gradient(circle at 50% 25%, rgba(255,0,60,.18), transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(100,0,25,.12), transparent 50%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.card {
    background: rgba(18,10,18,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,0,60,.25);
    border-radius: 32px;
    width: 100%;
    max-width: 380px;
    padding: 35px 24px 28px;
    text-align: center;
    box-shadow:
        0 25px 60px rgba(0,0,0,.95),
        0 0 35px rgba(255,0,60,.15),
        inset 0 1px 1px rgba(255,255,255,.15);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        #ff003c,
        #ff4d73,
        #ff003c,
        transparent
    );
}

.profile-container {
    position: relative;
    width: 145px;
    height: 145px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.profile-glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255,0,60,.25);
    filter: blur(15px);
    animation: pulseGlow 2.5s infinite alternate ease-in-out;
}

@keyframes pulseGlow {
    from {
        opacity: .4;
        transform: scale(.95);
    }

    to {
        opacity: .9;
        transform: scale(1.08);
    }
}

.rotating-ring-1,
.rotating-ring-2 {
    position: absolute;
    border-radius: 50%;
}

.rotating-ring-1 {
    inset: 0;
    background: conic-gradient(
        from 0deg,
        transparent 30%,
        #ff003c 70%,
        #fff 98%,
        transparent
    );
    animation: spinRing 2.2s linear infinite;
}

.rotating-ring-2 {
    inset: 3px;
    background: conic-gradient(
        from 180deg,
        transparent 40%,
        #ff3366 80%,
        #fff 98%,
        transparent
    );
    animation: spinRingReverse 3.5s linear infinite;
    opacity: .7;
}

@keyframes spinRing {
    to {
        transform: rotate(360deg);
    }
}

@keyframes spinRingReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

.profile-inner-bg {
    position: absolute;
    inset: 5px;
    background: #110712;
    border-radius: 50%;
    z-index: 1;
}

.profile-img {
    width: calc(100% - 18px);
    height: calc(100% - 18px);
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 2;
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 4px 15px rgba(0,0,0,.6);
}

.title-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
}

.title {
    font-family: 'Cinzel', serif;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(180deg,#fff,#e0d5e3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.verified-icon {
    color: #0088cc;
    font-size: 19px;
    filter: drop-shadow(0 0 6px rgba(0,136,204,.8));
    flex-shrink: 0;
}

.subtitle-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 26px;
}

.line {
    height: 1px;
    width: 25px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.3),
        transparent
    );
}

.subtitle {
    font-size: 10px;
    color: #bfaec2;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
}

.btn-wrapper {
    margin-bottom: 10px;
}

.premium-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(
        135deg,
        #ff0044,
        #cc0033 50%,
        #990026
    );
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 13px 22px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,.35);
    animation: bounceUpDown 2s ease-in-out infinite;
    box-shadow:
        0 10px 25px rgba(255,0,60,.5),
        inset 0 1px 1px rgba(255,255,255,.4);
    transition: box-shadow .3s ease;
}

.premium-btn:hover {
    box-shadow:
        0 10px 35px rgba(255,0,60,.75),
        inset 0 1px 1px rgba(255,255,255,.4);
}

.telegram-blue-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0088cc;
    border-radius: 50%;
    flex-shrink: 0;
}

.telegram-blue-icon svg {
    width: 18px;
    height: 18px;
    fill: #fff;
}

@keyframes bounceUpDown {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

.destination-note {
    font-size: 10px;
    color: #c6aeba;
    margin: 0 0 22px;
    overflow-wrap: anywhere;
}

.features {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
    font-size: 11px;
    color: #d8cbdc;
    font-weight: 600;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.dot {
    height: 5px;
    width: 5px;
    background: #ff003c;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff003c;
    flex-shrink: 0;
}

.managed-by {
    font-size: 13px;
    color: #fff;
    font-weight: 600;
    margin-bottom: 22px;
}

.managed-by span {
    color: #ff335c;
    font-weight: 800;
}

.divider {
    border: none;
    border-top: 1px dashed rgba(255,255,255,.12);
    margin-bottom: 18px;
}

.disclaimer {
    font-size: 10px;
    color: #9b899d;
    line-height: 1.5;
}

@media (max-width: 360px) {
    .card {
        padding: 30px 16px 24px;
    }

    .title {
        font-size: 21px;
        letter-spacing: 1px;
    }

    .features {
        gap: 8px;
        font-size: 9px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 1px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .profile-glow,
    .rotating-ring-1,
    .rotating-ring-2,
    .premium-btn {
        animation: none;
    }
}
</style>

</head>

<main class="card">

    <!-- Profile Image -->
    <div class="profile-container">

        <div class="profile-inner-bg"></div>

        <img

        >

    </div>

    <!-- Main Headline -->
    <div class="title-wrapper">

        <h1 class="title">SYSTEM ARMY</h1>

        <i
            class="fa-solid fa-circle-check verified-icon"

        ></i>

    </div>

    <!-- Subtitle -->
    <div class="subtitle-box">

        <div class="line"></div>

    </div>

    <!-- Telegram Join Button -->
    <div class="btn-wrapper">

        <a
            id="telegramJoinButton"
            href="https://t.me/+YkSbaiPZeDxkNTk1"

        >

            <span class="telegram-blue-icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

<script>
(() => {

    // Five Telegram channel links
    const links = [
        "https://t.me/+YkSbaiPZeDxkNTk1",
        "https://t.me/+EIn8Ls4LhrEwY2Fl",
        "https://t.me/+C-pVzHalh4czODhl",
        "https://t.me/+1Xa8LBwTQ1E4ZDg1",
        "https://t.me/+C-pVzHalh4czODhl"
    ];

    const button = document.getElementById("telegramJoinButton");
    const number = document.getElementById("destinationNumber");

    if (!button || !number || links.length === 0) {
        return;
    }

    let index = 0;

    function updateDestination() {

        button.href = links[index];

        number.textContent = String(index + 1);

    }

    // Set the first channel immediately
    updateDestination();

    // Rotate the channel link every 3 seconds
    setInterval(() => {

        index = (index + 1) % links.length;

        updateDestination();

    }, 3000);

    // Track Telegram button clicks with Meta Pixel
    button.addEventListener("click", () => {

        if (typeof window.fbq === "function") {

            window.fbq("trackCustom", "TelegramButtonClick", {
                destination_number: index + 1
            });

        }

    });

})();
</script>
